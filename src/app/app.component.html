<div class="container">
  <h1>Sorteador de Itens</h1>

  <textarea
    [(ngModel)]="textoLista"
    placeholder="Cole aqui os itens (um por linha) ou digite manualmente"
    rows="6"
    (paste)="onPaste()"
    (input)="onInput()"
  >
  </textarea>

  <div class="qtd-sorteios">
    <label for="quantidade">Quantidade de sorteios:</label>
    <input type="number" [(ngModel)]="quantidadeSorteios" min="1" />
  </div>

  <div class="actions">
    <button (click)="sortear()" [disabled]="lista.length === 0">🎯 Sortear</button>
    <button (click)="resetar()" *ngIf="listaOriginal.length">🔁 Resetar</button>
    <button (click)="limparHistoricoSorteios()">🧹 Limpar apenas o histórico</button>
  </div>

  <div *ngIf="mensagem" class="alerta">
    {{ mensagem }}
  </div>

  <div class="resultado-wrapper">
    <div class="resultado" [class.animado]="animando">
      <ng-container *ngIf="itensSorteados.length; else aguardando">
        <div *ngFor="let item of itensFiltrados">{{ item }}</div>
      </ng-container>
      <ng-template #aguardando> Aguardando sorteio... </ng-template>
    </div>
  </div>

  <div *ngIf="itensSorteados.length > 0">
    <h3>Histórico de Sorteios:</h3>
    <ul>
      <li *ngFor="let item of itensSorteados">{{ item }}</li>
    </ul>
  </div>
</div>
