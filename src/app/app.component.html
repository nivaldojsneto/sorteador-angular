<div
  class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col sm:items-center sm:justify-center p-4"
>
  <div class="w-full max-w-2xl bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 mt-8">
    <!-- Cabeçalho com logo e botão de tema -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-4">
        <img src="assets/logo-light.svg" alt="Logo Sorteador" class="h-10 block dark:hidden" />
        <img
          src="assets/logo-dark.svg"
          alt="Logo Sorteador (dark)"
          class="h-10 hidden dark:block"
        />
      </div>
      <button
        (click)="alternarTema()"
        class="relative inline-flex items-center w-14 h-8 rounded-full transition-colors duration-300 ease-in-out bg-gray-300 dark:bg-gray-700"
      >
        <span
          class="absolute left-1 top-1 w-6 h-6 rounded-full bg-white transform transition-transform duration-300 ease-in-out"
          [ngClass]="{ 'translate-x-6': temaEscuroAtivo, 'translate-x-0': !temaEscuroAtivo }"
        ></span>

        <svg
          class="absolute left-1 top-1 w-6 h-6 text-yellow-400 transition-opacity duration-300"
          fill="currentColor"
          viewBox="0 0 20 20"
          *ngIf="!temaEscuroAtivo"
        >
          <path d="M10 15a5 5 0 100-10 5 5 0 000 10z"></path>
        </svg>
        <svg
          class="absolute left-7 top-1 w-6 h-6 text-gray-200 transition-opacity duration-300"
          fill="currentColor"
          viewBox="0 0 20 20"
          *ngIf="temaEscuroAtivo"
        >
          <path
            d="M17.293 13.293A8 8 0 016.707 2.707 8.001 8.001 0 0010 18a8 8 0 007.293-4.707z"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Textarea -->
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
      >Cole ou digite os itens no campo baixo (um por linha):</label
    >
    <textarea
      [(ngModel)]="textoLista"
      (input)="onInput()"
      (paste)="onPaste()"
      class="w-full h-40 p-3 border rounded-lg mb-4 focus:outline-none focus:ring focus:border-blue-300 resize-none dark:bg-gray-700 dark:text-white"
    ></textarea>

    <!-- Contador de linhas -->
    <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 fade-in">
      Total de linhas: {{ lista.length }}
    </p>

    <!-- Controles -->
    <div class="flex flex-col sm:flex-row items-center gap-4 mb-4">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
          >Quantidade de sorteios:</label
        >
        <input
          type="number"
          [(ngModel)]="quantidadeSorteios"
          class="w-full p-2 border rounded-md focus:outline-none focus:ring focus:border-blue-300 dark:bg-gray-700 dark:text-white"
          min="1"
        />
      </div>
      <button
        (click)="sortear()"
        [disabled]="lista.length === 0 || animando"
        class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg mt-2 sm:mt-7 hover:bg-blue-700 transition disabled:opacity-50"
      >
        Sortear
      </button>
    </div>

    <!-- Mensagem de feedback -->
    <div
      *ngIf="mensagem"
      class="bg-yellow-100 dark:bg-yellow-200 text-yellow-700 text-sm p-2 rounded mb-4 fade-in"
    >
      {{ mensagem }}
    </div>

    <!-- Animação e progresso -->
    <div *ngIf="listaOriginal.length > 0 && progresso > 0" class="mb-6 text-center">
      <p class="text-blue-500 text-lg font-medium mb-2 animate-pulse">
        Sorteando entre {{ listaOriginal.length }} itens...
      </p>

      <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700 mb-2">
        <div
          class="bg-blue-600 h-2.5 rounded-full transition-all duration-500"
          [style.width.%]="animando ? progresso : 100"
        ></div>
      </div>

      <p *ngIf="animando" class="text-sm italic text-gray-600 dark:text-gray-400">
        Verificando: {{ nomeEmFoco }}
      </p>
    </div>

    <!-- Resultado -->
    <div *ngIf="itensFiltrados.length > 0 && !animando" id="resultado" class="mb-6 fade-in">
      <h2 class="text-lg font-semibold mb-2">Resultado:</h2>
      <ul class="list-disc list-inside space-y-1 text-green-700 dark:text-green-400 animate-bounce">
        <li *ngFor="let nome of itensFiltrados">{{ nome }}</li>
      </ul>
    </div>

    <!-- Ações secundárias -->
    <div class="flex justify-end gap-2">
      <button (click)="resetar()" class="text-sm text-gray-600 dark:text-gray-300 hover:underline">
        Limpar lista
      </button>
      <button
        (click)="limparHistoricoSorteios()"
        class="text-sm text-gray-600 dark:text-gray-300 hover:underline"
      >
        Limpar histórico
      </button>
    </div>
  </div>

  <footer class="text-center text-sm text-gray-500 dark:text-gray-400 mt-8">
    Desenvolvido por Nivaldo • © 2025
  </footer>
</div>
