<div class="container">
  <h1>Sorteador de Itens</h1>

  <textarea
    [(ngModel)]="textoLista"
    placeholder="Cole aqui os itens (um por linha)"
    rows="6"
    (paste)="onPaste()"
  >
  </textarea>

  <div class="qtd-sorteios">
    <label for="quantidade">Quantidade de sorteios:</label>
    <input
      type="number"
      id="quantidade"
      [(ngModel)]="quantidadeSorteios"
      min="1"
      [max]="lista.length"
    />
  </div>

  <div class="actions">
    <button (click)="sortear()" [disabled]="lista.length === 0">🎯 Sortear</button>
    <button (click)="resetar()" *ngIf="listaOriginal.length">🔁 Resetar</button>
  </div>

  <div class="resultado-wrapper">
    <div class="resultado" [class.animado]="animando">
      <ng-container *ngIf="itensSorteados.length; else aguardando">
        <div *ngFor="let item of itensSorteados">{{ item }}</div>
      </ng-container>
      <ng-template #aguardando> Aguardando sorteio... </ng-template>
    </div>
  </div>
</div>
